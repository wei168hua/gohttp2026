name: build-dll
on: [push, workflow_dispatch]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.21' }
      - run: go mod tidy
      - run: go build -buildmode=c-shared -o gohttp.dll .
        env: { CGO_ENABLED: '1' }
      - uses: actions/upload-artifact@v4
        with:
          name: gohttp-dll
          path: |
            gohttp.dll
            gohttp.h
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.21' }
      - run: go mod tidy
      - run: go build -buildmode=c-shared -o gohttp.so .
        env: { CGO_ENABLED: '1' }
      - uses: actions/upload-artifact@v4
        with:
          name: gohttp-so
          path: |
            gohttp.so
            gohttp.h
