name: build-dll

on:
  push:
    branches: [ "v2", "main" ]
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
      - name: 拉依赖
        run: |
          go get github.com/refraction-networking/utls@v1.5.4
          go get golang.org/x/net@v0.17.0
          go mod tidy
      - name: 编译 Windows DLL
        run: go build -buildmode=c-shared -o gohttp.dll .
        env:
          CGO_ENABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: gohttp-dll
          path: |
            gohttp.dll
            gohttp.h

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
      - name: 拉依赖
        run: |
          go get github.com/refraction-networking/utls@v1.5.4
          go get golang.org/x/net@v0.17.0
          go mod tidy
      - name: 编译 Linux SO
        run: go build -buildmode=c-shared -o gohttp.so .
        env:
          CGO_ENABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: gohttp-so
          path: |
            gohttp.so
            gohttp.h
