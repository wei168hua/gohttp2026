name: build-dll

on:
  push:
    branches: [ "v2-gohttp", "V3", "main" ]
  workflow_dispatch:

jobs:
  win32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.20'

      - name: 安装 32 位 MinGW
        shell: bash
        run: |
          C:/msys64/usr/bin/pacman -S --noconfirm mingw-w64-i686-gcc
          echo "C:/msys64/mingw32/bin" >> $GITHUB_PATH

      - name: 验证 32 位 gcc
        shell: bash
        run: |
          which gcc
          gcc -dumpmachine
          gcc --version

      - name: 初始化 go.mod
        shell: bash
        run: |
          if [ ! -f go.mod ]; then
            go mod init gohttpdll
          fi

      - name: 拉依赖
        shell: bash
        run: |
          go get github.com/refraction-networking/utls@v1.5.4
          go get golang.org/x/net@v0.17.0
          go mod tidy

      - name: 编译 32 位 DLL
        shell: bash
        run: |
          export CC="C:/msys64/mingw32/bin/gcc.exe"
          export CXX="C:/msys64/mingw32/bin/g++.exe"
          GOARCH=386 GOOS=windows CGO_ENABLED=1 \
            go build -v -buildmode=c-shared -o gohttp_x86.dll .
          ls -la gohttp_x86.dll

      - uses: actions/upload-artifact@v4
        with:
          name: gohttp-x86
          path: |
            gohttp_x86.dll
            gohttp.h
          if-no-files-found: error
          retention-days: 30
